plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.player'
    compileSdk 34

    defaultConfig {
        applicationId 'com.local.player'
        minSdk 24
        // shortcut: uses the installed SDK 34; update the target and permissions before store publication.
        targetSdk 34
        versionCode 2
        versionName '1.1'
        testInstrumentationRunner 'com.local.player.SmokeTest'
    }
}
